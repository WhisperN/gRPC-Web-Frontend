<!DOCTYPE html>
<html>
<script src="style/animate.ts" type="typescript"></script>
<head>
    <meta charset="UTF-8">
    <title>GRPC Performance frontend</title>
</head>
<body>
<nav class="navbar">
    <div class="nav-links" role="navigation" aria-label="Primary">
        <a href="/public" aria-current="page">Native</a>
        <a href="/wasm">Wasm</a>

        <div class="dropdown">
            <button class="wasm-webgl" type="button"
                    aria-expanded="false" aria-controls="menu-webgl">
                Wasm+WebGL
                <span class="chev" aria-hidden="true">▾</span>
            </button>

            <div id="menu-webgl" class="wasm-webgl-menu" role="menu" tabindex="-1">
                <a class="navbar-dropdown-element" role="menuitem" href="/wasm/2d">2D</a>
                <a class="navbar-dropdown-element" role="menuitem" href="/wasm/3d">3D</a>
                <a class="navbar-dropdown-element" role="menuitem" href="/wasm/compute">Compute shaders</a>
            </div>
        </div>
    </div>
</nav>

<section class="height-100 width-100 flex-horizontal">
    <div id="spinningGlobe" class="spinning-globe"></div>
    <div id="spinningGlobeSidebar" class="sidebar-menu">
        <div class="flex-horizontal flex-justify-between">
            <div onclick="expandMenu('sidebar')"
            class="sidebar-collapse"
            style="font-size: 1.6em;">
                <a id="sidebar-down">&CircleMinus;</a>
                <a id="sidebar-up" hidden>&CirclePlus;</a>
            </div>
        </div>
        <form id="spinningGlobeSidebarFormat"
              class="sidebar-rendering flex-vertical">
            <h3>File Format</h3>
            <label>
                <input type="radio" name="format" value="parquet">parquet
            </label>
            <label>
                <input type="radio" name="format" value="arrow" disabled>arrow
            </label>
            <label>
                <input type="radio" name="format" value="arrow">raw (flight IPC)
            </label>
            <h3>Network Protocols</h3>
            <label>
                <input type="radio" name="protocol" value="h1">HTTP/1.1
            </label>
            <label>
                <input type="radio" name="protocol" value="h2">HTTP/2
            </label>
            <label>
                <input type="radio" name="protocol" value="gRPC">gRPC-Web (+Arrow IPC)
            </label>
            <!-- Add a button only for Network performance tests. -->
            <h3>Calculation Engine</h3>
            <label>
                <input type="radio" name="engine" value="wasm">WASM
            </label>
            <label>
                <input type="radio" name="engine" value="wasmWebGpu">WASM + WebGPU
            </label>
            <label>
                <input type="radio" name="engine" value="ts">TypeScript (pure)
            </label>
            <button type="submit">Load</button>
        </form>
    </div>
</section>
</body>
</html>
